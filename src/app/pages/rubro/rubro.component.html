<section class="rubro">
  <header class="rubro__head rise-in">
    <span class="eyebrow">Categoría</span>
    <h2>{{ categoryName() }}</h2>
    <p *ngIf="productos().length">{{ productos().length }} {{ productos().length === 1 ? 'producto' : 'productos' }}</p>
  </header>

  <div class="lista stagger">
    <app-tarjeta-producto *ngFor="let producto of productos(); let i = index" [style.--i]="i + 1"
      [producto]="producto" [routerLink]="['/articulo', producto._id || producto.category]">
    </app-tarjeta-producto>
  </div>
</section>
