<div class="articulo" *ngIf="producto">
  <div class="hero">
    <img *ngIf="producto.photoUrl; else noFoto" class="hero__foto" [src]="producto.photoUrl" [alt]="producto.name" />
    <ng-template #noFoto>
      <div class="hero__foto hero__foto--vacia" aria-hidden="true"></div>
    </ng-template>

    <button type="button" class="hero__back" (click)="volver()" aria-label="Volver">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" />
      </svg>
    </button>

    <span class="sin-tacc" *ngIf="producto.sinTacc">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <!-- Espiga de trigo tachada -->
        <path d="M12 21V9" />
        <path d="M12 9c-2.2 0-3.5-1.6-3.5-4 2.2 0 3.5 1.6 3.5 4Zm0 0c2.2 0 3.5-1.6 3.5-4-2.2 0-3.5 1.6-3.5 4Z" />
        <path d="M12 14c-2.2 0-3.5-1.6-3.5-4 2.2 0 3.5 1.6 3.5 4Zm0 0c2.2 0 3.5-1.6 3.5-4-2.2 0-3.5 1.6-3.5 4Z" />
        <path d="M4 4l16 16" />
      </svg>
      Sin TACC · Apto celíacos
    </span>
  </div>

  <div class="hoja stagger">
    <header class="hoja__head" style="--i: 0">
      <h1>{{ producto.name }}</h1>
      <span class="hoja__precio">${{ producto.price | number:'1.0-0':'es-AR' }}</span>
    </header>

    <p class="hoja__desc" style="--i: 1" *ngIf="producto.ingredients">
      <ng-container *ngIf="isArray(producto.ingredients); else textIngredients">
        <span *ngFor="let ingrediente of producto.ingredients; let last = last">{{ ingrediente }}<span
            *ngIf="!last">, </span></span>
      </ng-container>
      <ng-template #textIngredients>{{ producto.ingredients }}</ng-template>
    </p>

    <section class="bloque" style="--i: 2" *ngIf="producto.extras && producto.extras.length > 0">
      <div class="bloque__head">
        <div>
          <h2>Agregá extras</h2>
          <span>Opcional · hasta 3</span>
        </div>
        <span class="contador-extras" [class.contador-extras--lleno]="extrasSeleccionados.length >= 3">
          {{ extrasSeleccionados.length }}/3
        </span>
      </div>

      <div class="extras">
        <label *ngFor="let extra of producto.extras" class="extra" [class.extra--on]="extraSeleccionado(extra)"
          [class.extra--off]="!extraSeleccionado(extra) && extrasSeleccionados.length >= 3">
          <input type="checkbox" [checked]="extraSeleccionado(extra)"
            [disabled]="!extraSeleccionado(extra) && extrasSeleccionados.length >= 3"
            (change)="actualizarExtrasSeleccionados(extra)" />
          <span class="extra__check" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 12.5l4.5 4.5L19 7.5" />
            </svg>
          </span>
          <span class="extra__nombre">{{ extra.name }}</span>
          <span class="extra__precio">+${{ extra.price | number:'1.0-0':'es-AR' }}</span>
        </label>
      </div>
    </section>

    <section class="bloque" style="--i: 3">
      <div class="bloque__head">
        <div>
          <h2>Notas para la cocina</h2>
          <span>Opcional</span>
        </div>
      </div>
      <textarea id="notas" name="notas" rows="3" [(ngModel)]="notas"
        placeholder="Ej. sin cebolla, aderezo aparte..."></textarea>
    </section>
  </div>

  <div class="barra">
    <div class="stepper" role="group" aria-label="Cantidad">
      <button type="button" (click)="actualizarNum(-1)" [disabled]="numero() === 1" aria-label="Restar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
      </button>
      <span class="stepper__n" *ngFor="let n of [numero()]">{{ n }}</span>
      <button type="button" (click)="actualizarNum(1)" aria-label="Sumar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" /></svg>
      </button>
    </div>

    <button type="button" class="btn btn--primary barra__agregar" (click)="agregarAlCarrito()">
      <span>Agregar</span>
      <strong>${{ total | number:'1.0-0':'es-AR' }}</strong>
    </button>
  </div>
</div>
