<div class="producto-page" *ngIf="producto">

  <!-- IMAGEN -->
  <div class="producto-image-wrapper">
    <div *ngIf="producto.photoUrl; else noFoto" class="producto-image">
      <img [src]="producto.photoUrl" [alt]="producto.name" />
    </div>

    <ng-template #noFoto>
      <div class="no-foto">
        <span>Sin imagen</span>
      </div>
    </ng-template>

    <!-- Botón volver -->
    <button type="button" class="back-button" (click)="router.navigate(['/'])" aria-label="Volver">
      ←
    </button>

    <!-- Badge -->
    <span class="badge-producto">
      <span class="badge-dot"></span>
      Más pedido
    </span>
  </div>


  <!-- CONTENIDO -->
  <div class="producto-content">

    <!-- CABECERA -->
    <div class="producto-header">

      <div class="producto-info">

        <span class="producto-categoria">
          DETALLE DEL PRODUCTO
        </span>

        <h1 class="name-product">
          {{ producto.name }}
        </h1>

      </div>

      <div class="producto-precio">
        ${{ producto.price | number:'1.2-2' }}
      </div>

    </div>


    <!-- INGREDIENTES -->
    <div class="descripcion-producto">

      <ng-container *ngIf="isArray(producto.ingredients); else textIngredients">
        <span *ngFor="let ingrediente of producto.ingredients; let last = last">
          {{ ingrediente }}<span *ngIf="!last">, </span>
        </span>
      </ng-container>

      <ng-template #textIngredients>
        {{ producto.ingredients }}
      </ng-template>

    </div>


    <!-- EXTRAS -->
    <section class="extras-section" *ngIf="producto.extras && producto.extras.length > 0">

      <div class="section-header">

        <div>
          <h2>Agrega extras</h2>
          <span>Opcional · Selecciona hasta 3</span>
        </div>

        <span class="extras-counter">
          {{ extrasSeleccionados.length }} de 3
        </span>

      </div>


      <div class="extras-list">

        <label *ngFor="let extra of producto.extras" class="extra-card" [class.selected]="extraSeleccionado(extra)"
          [class.disabled]="
            !extraSeleccionado(extra) &&
            extrasSeleccionados.length >= 3
          ">

          <input type="checkbox" [checked]="extraSeleccionado(extra)" [disabled]="
              !extraSeleccionado(extra) &&
              extrasSeleccionados.length >= 3
            " (change)="actualizarExtrasSeleccionados(extra)" />

          <div class="extra-info">

            <strong>
              {{ extra.name }}
            </strong>

            <span>
              Extra {{ extra.name | lowercase }}
            </span>

          </div>

          <div class="extra-right">

            <span class="extra-price">
              +${{ extra.price | number:'1.2-2' }}
            </span>

            <span class="check-circle">
              ✓
            </span>

          </div>

        </label>

      </div>

    </section>


    <!-- NOTAS -->
    <section class="notas-section">

      <div class="section-header notas-header">

        <div>
          <h2>Notas para la cocina</h2>
          <span>Opcional</span>
        </div>

      </div>

      <textarea id="notas" name="notas" [(ngModel)]="notas" placeholder="Ej. sin cebolla, aderezo aparte..."></textarea>

    </section>



  </div>

</div>
<!-- CANTIDAD -->
<section class="cantidad-section">
  <div class="cantidad-left">
    <span class="cantidad-label">
      CANTIDAD
    </span>

    <!-- <app-contador-cantidad (cantidadNueva)="cantidad = $event"></app-contador-cantidad> -->
    <div id="container">
      <button (click)="actualizarNum(1)">+</button>
      <span>{{ numero() }}</span>
      <button (click)="actualizarNum(-1)" [disabled]="numero() === 1">-</button>
    </div>
  </div>

  <div class="pedido-footer">
    <button type="button" class="add-button" (click)="agregarAlCarrito()">
      <span class="cart-icon">
        🛍
      </span>

      <span>
        Agregar
      </span>

      <strong>
        ${{ total | number:'1.2-2' }}
      </strong>
    </button>
  </div>
</section>
