<section>
  <form id="perfilForm" #formulario="ngForm" class="perfil-form" (ngSubmit)="guardarDatosPerfil(formulario)">
    <header class="perfil-form__intro">
      <h2>Tus datos</h2>
      <p>Los usamos para identificar tu pedido.</p>
    </header>

    <div class="perfil-card">
      <div class="field" [class.field--error]="nombre.invalid && nombre.touched">
        <label for="nombre">Nombre</label>
        <div class="field__control">
          <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
          </svg>
          <input type="text" id="nombre" name="nombre" placeholder="¿Ingresa un nombre?" autocomplete="given-name"
            [(ngModel)]="perfil.nombre" #nombre="ngModel" minlength="3" required
            [attr.aria-invalid]="nombre.invalid && nombre.touched" />
        </div>
        <p class="field__error" *ngIf="nombre.invalid && nombre.touched">
          Ingresá un nombre (mínimo 3 letras)
        </p>
      </div>

      <div class="field">
        <label for="notas"><span class="field__optional">(opcional)</span></label>
        <div class="field__control field__control--top">
          <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4h14v16H5z" />
            <path d="M9 9h6M9 13h6M9 17h3" />
          </svg>
          <textarea id="notas" name="notas" rows="3" placeholder="Ej: sin cebolla, bien cocido..."
            [(ngModel)]="perfil.detalleEntrega"></textarea>
        </div>
      </div>
    </div>

    <label class="perfil-switch" for="takeAway">
      <span class="perfil-switch__text">
        <strong>Take Away</strong>
        <small>Lo retiro para llevar</small>
      </span>
      <input type="checkbox" id="takeAway" name="takeAway" [(ngModel)]="perfil.takeAway" />
      <span class="perfil-switch__track" aria-hidden="true"></span>
    </label>
  </form>
</section>
<div class="pedido-footer">
  <button type="submit" form="perfilForm">Enviar</button>
</div>
