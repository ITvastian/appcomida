<section id="barra-busqueda">
  <img src="assets/icons/lupa.svg" alt="Buscar" />
  <input type="text" placeholder="Busca una categoría..." autocomplete="off" [ngModel]="textoBusqueda()"
    (ngModelChange)="textoBusqueda.set($event)" />
  <button class="btn-clear" *ngIf="textoBusqueda()" (click)="limpiarBusqueda()">x</button>
</section>

<app-carrusel></app-carrusel>
<section class="home-categorias margenChico">
  <!-- <h2>Selecciona una categoría</h2> -->
  <div class="categorias-header">
    <div>
      <span class="section-eyebrow">MENÚ</span>
      <h2>Selecciona una categoría</h2>
    </div>
  </div>
  <div class="loading" *ngIf="cargandoCategorias()">
    <div class="skeleton-card" *ngFor="let _ of [1, 2, 3, 4]"></div>
  </div>

  <div class="error" *ngIf="!cargandoCategorias() && errorCategorias()">
    <p>No pudimos cargar las categorias.</p>
    <button type="button" (click)="reintentarCargaCategorias()">Reintentar</button>
  </div>

  <div id="category-container"
    *ngIf="!cargandoCategorias() && !errorCategorias() && categoriasFiltradasVacio().length > 0">
    <app-tarjeta-category *ngFor="let categoria of categoriasFiltradasVacio()" [categoria]="categoria"
      [routerLink]="['/categoria', categoria.id || categoria.name]" [queryParams]="{ name: categoria.name }"
      routerLinkActive="router-link-active"></app-tarjeta-category>
  </div>

  <p class="empty" *ngIf="!cargandoCategorias() && !errorCategorias() && categoriasFiltradasVacio().length === 0">
    {{ textoBusqueda() ? 'No encontramos esa categoría' : 'No hay categorías disponibles por ahora.' }}
  </p>
</section>
