<app-carrusel></app-carrusel>
<section class="home-categorias margenChico">
  <h2>Selecciona una categoría</h2>

  <div class="loading" *ngIf="cargandoCategorias()">
    <div class="skeleton-card" *ngFor="let _ of [1, 2, 3, 4]"></div>
  </div>

  <div class="error" *ngIf="!cargandoCategorias() && errorCategorias()">
    <p>No pudimos cargar las categorias.</p>
    <button type="button" (click)="reintentarCargaCategorias()">Reintentar</button>
  </div>

  <div id="category-container" *ngIf="!cargandoCategorias() && !errorCategorias() && categorias().length > 0">
    <app-tarjeta-category *ngFor="let categoria of categorias()" [categoria]="categoria"
      [routerLink]="['/categoria', categoria.name]" routerLinkActive="router-link-active"></app-tarjeta-category>
  </div>

  <p class="empty" *ngIf="!cargandoCategorias() && !errorCategorias() && categorias().length === 0">
    No hay categorias disponibles por ahora.
  </p>
</section>
