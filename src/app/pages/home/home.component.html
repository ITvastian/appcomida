<div class="home">
  <!-- Acceso a la búsqueda de productos (tab Buscar), que abre con el teclado listo. -->
  <a class="buscador" routerLink="/buscar" [queryParams]="{ foco: 1 }">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5" />
      <path d="m20 20-4.2-4.2" />
    </svg>
    <span class="buscador__placeholder">Buscar en el menú</span>
  </a>

  <app-carrusel class="rise-in"></app-carrusel>

  <section class="categorias">
    <header class="categorias__head">
      <span class="eyebrow">Menú</span>
      <h2>¿Qué tenés ganas de comer?</h2>
    </header>

    <div class="grid" *ngIf="cargandoCategorias()">
      <div class="skeleton" *ngFor="let _ of [1, 2, 3, 4]"></div>
    </div>

    <div class="estado" *ngIf="!cargandoCategorias() && errorCategorias()">
      <p>No pudimos cargar las categorías.</p>
      <button class="btn btn--primary" type="button" (click)="reintentarCargaCategorias()">Reintentar</button>
    </div>

    <div class="grid stagger"
      *ngIf="!cargandoCategorias() && !errorCategorias() && categorias().length > 0">
      <app-tarjeta-category *ngFor="let categoria of categorias(); let i = index"
        [style.--i]="i" [categoria]="categoria" [sinTacc]="tieneSinTacc(categoria)" [routerLink]="['/categoria', categoria.id || categoria.name]"
        [queryParams]="{ name: categoria.name }"></app-tarjeta-category>
    </div>

    <div class="estado"
      *ngIf="!cargandoCategorias() && !errorCategorias() && categorias().length === 0">
      <!-- Sin local cargado (no se entró desde el QR) no hay menú que mostrar. -->
      <ng-container *ngIf="sinLocal; else sinCategorias">
        <span class="estado__icono" aria-hidden="true">📱</span>
        <strong>Escaneá el código QR de tu mesa</strong>
        <p>Así te mostramos el menú del local.</p>
      </ng-container>
      <ng-template #sinCategorias>No hay categorías disponibles por ahora.</ng-template>
    </div>
  </section>
</div>
