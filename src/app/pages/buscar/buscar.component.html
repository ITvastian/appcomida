<section class="buscar">
  <form #buscarForm="ngForm" (submit)="onSubmit($event)">
    <label class="buscador rise-in" for="buscar-texto">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" />
        <path d="m20 20-4.2-4.2" />
      </svg>
      <input id="buscar-texto" type="text" name="texto" placeholder="¿Qué se te antoja?" autocomplete="off"
        [(ngModel)]="parametrosBusqueda.texto" (input)="onInputChange()" (keydown)="onKeydown($event)" />
      <button class="buscador__limpiar" type="button" *ngIf="parametrosBusqueda.texto" (click)="clear()"
        aria-label="Limpiar búsqueda">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    </label>
  </form>

  <div class="lista stagger" *ngIf="productos.length !== 0; else sinResultado">
    <app-tarjeta-producto *ngFor="let producto of productos; let i = index" [style.--i]="i" [producto]="producto"
      [routerLink]="['/articulo', producto._id || producto.category]"></app-tarjeta-producto>
  </div>

  <ng-template #sinResultado>
    <div class="vacio rise-in">
      <span class="vacio__icono" aria-hidden="true">🔍</span>
      <h2>Sin resultados</h2>
      <p>Probá con otra palabra.</p>
    </div>
  </ng-template>
</section>
