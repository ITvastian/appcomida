<nav class="tabbar" [class.tabbar--sin-activo]="activo() < 0" [style.--activo]="activo() < 0 ? 0 : activo()"
  aria-label="Navegación principal">
  <span class="tabbar__indicador" aria-hidden="true">
    <span class="tabbar__blob" #blob></span>
  </span>

  <a *ngFor="let tab of tabs; let i = index" class="tabbar__item" [class.is-activo]="i === activo()"
    [routerLink]="tab.path" [attr.aria-current]="i === activo() ? 'page' : null">
    <span class="tabbar__icono" [ngSwitch]="i">
      <!-- Menú -->
      <svg *ngSwitchCase="0" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10" />
        <path d="M17 21V3c-2.2 0-4 2.5-4 6.5 0 2.2 1 3.5 2.5 3.5H17" />
      </svg>
      <!-- Buscar -->
      <svg *ngSwitchCase="1" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" />
        <path d="m20 20-4.2-4.2" />
      </svg>
      <!-- Pedido -->
      <svg *ngSwitchCase="2" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9L5 8Z" />
        <path d="M9 8V6.5a3 3 0 0 1 6 0V8" />
      </svg>
      <!-- Perfil -->
      <svg *ngSwitchCase="3" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4.5 20.5c.8-3.8 3.9-6 7.5-6s6.7 2.2 7.5 6" />
      </svg>

      <ng-container *ngIf="i === 2 && cantidadEnCarrito > 0">
        <!-- El *ngFor sobre [cantidad] recrea el badge al cambiar, así repite el "pop". -->
        <span class="tabbar__badge" *ngFor="let n of [cantidadEnCarrito]">{{ n > 99 ? '99+' : n }}</span>
      </ng-container>
    </span>
    <span class="tabbar__label">{{ tab.label }}</span>
  </a>
</nav>
