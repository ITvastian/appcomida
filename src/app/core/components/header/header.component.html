<header [ngClass]="{extendido:headerService.extendido()}"
  [ngStyle]="{'background-image': 'url(' + backgroundImageUrl() + ')'}" class="header-with-background">
  <button class="home-back" type="button" (click)="volverAtras()" aria-label="Volver">
    &larr;
  </button>

  <h1 [ngClass]="[claseAplicada(), !tituloVisible() ? 'sin-titulo' : '']" (animationend)="mostrarTituloNuevo($event)">
    {{ tituloVisible() }}
  </h1>
</header>
