<header [ngClass]="{ extendido: headerService.extendido() }" class="header">
  <div class="header__fondo" [style.background-image]="backgroundImageUrl() ? 'url(' + backgroundImageUrl() + ')' : null">
  </div>

  <button class="header__back" type="button" (click)="volverAtras()" aria-label="Volver">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15 5l-7 7 7 7" />
    </svg>
  </button>

  <h1 [ngClass]="[claseAplicada(), !tituloVisible() ? 'sin-titulo' : '']" (animationend)="mostrarTituloNuevo($event)">
    {{ tituloVisible() }}
  </h1>

  <!-- Mesa actual; con pedido en curso lleva a "Tu pedido". -->
  <a class="header__mesa" *ngIf="headerService.extendido() && mesa > 0" routerLink="/carrito"
    [class.header__mesa--pedido]="pedidoActivo.hayPedido()"
    [attr.aria-label]="pedidoActivo.hayPedido() ? 'Mesa ' + mesa + ', pedido en curso' : 'Mesa ' + mesa">
    <span class="header__mesa-punto" *ngIf="pedidoActivo.hayPedido()" aria-hidden="true"></span>
    Mesa {{ mesa }}
  </a>
</header>
