<article class="card">
  <img *ngIf="categoria.photoUrl; else sinFoto" class="card__foto" [src]="categoria.photoUrl" [alt]="categoria.name"
    loading="lazy" />
  <ng-template #sinFoto>
    <div class="card__foto card__foto--vacia" aria-hidden="true"></div>
  </ng-template>

  <div class="card__info">
    <h3>{{ categoria.name }}</h3>
    <span class="card__flecha" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M9 5l7 7-7 7" />
      </svg>
    </span>
  </div>
</article>
