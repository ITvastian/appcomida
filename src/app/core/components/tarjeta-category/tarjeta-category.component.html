<article class="card">
  <img *ngIf="categoria.photoUrl; else sinFoto" class="card__foto" [src]="categoria.photoUrl" [alt]="categoria.name"
    loading="lazy" />
  <ng-template #sinFoto>
    <div class="card__foto card__foto--vacia" aria-hidden="true"></div>
  </ng-template>

  <span class="card__sin-tacc" *ngIf="sinTacc" title="Tiene opciones sin TACC" aria-label="Tiene opciones sin TACC">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <!-- Espiga de trigo tachada -->
      <path d="M12 21V9" />
      <path d="M12 9c-2.2 0-3.5-1.6-3.5-4 2.2 0 3.5 1.6 3.5 4Zm0 0c2.2 0 3.5-1.6 3.5-4-2.2 0-3.5 1.6-3.5 4Z" />
      <path d="M12 14c-2.2 0-3.5-1.6-3.5-4 2.2 0 3.5 1.6 3.5 4Zm0 0c2.2 0 3.5-1.6 3.5-4-2.2 0-3.5 1.6-3.5 4Z" />
      <path d="M4 4l16 16" />
    </svg>
  </span>

  <div class="card__info">
    <h3>{{ categoria.name }}</h3>
    <span class="card__flecha" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M9 5l7 7-7 7" />
      </svg>
    </span>
  </div>
</article>
