<article class="producto">
  <div class="producto__foto">
    <img *ngIf="getProductImage(); else sinFoto" [src]="getProductImage()" [alt]="producto.name" loading="lazy" />
    <ng-template #sinFoto><span class="producto__vacio" aria-hidden="true"></span></ng-template>
    <span class="sin-tacc" *ngIf="producto.sinTacc" title="Sin TACC" aria-label="Sin TACC">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <!-- Espiga de trigo tachada -->
        <path d="M12 21V9" />
        <path d="M12 9c-2.2 0-3.5-1.6-3.5-4 2.2 0 3.5 1.6 3.5 4Zm0 0c2.2 0 3.5-1.6 3.5-4-2.2 0-3.5 1.6-3.5 4Z" />
        <path d="M12 14c-2.2 0-3.5-1.6-3.5-4 2.2 0 3.5 1.6 3.5 4Zm0 0c2.2 0 3.5-1.6 3.5-4-2.2 0-3.5 1.6-3.5 4Z" />
        <path d="M4 4l16 16" />
      </svg>
      <span>Sin TACC</span>
    </span>
  </div>

  <div class="producto__info">
    <h4>{{ producto.name }}</h4>
    <p *ngIf="producto.ingredients || producto.description">{{ producto.ingredients || producto.description }}</p>

    <div class="producto__pie">
      <span class="producto__precio">${{ producto.price | number:'1.0-0':'es-AR' }}</span>
      <span class="producto__mas" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </span>
    </div>
  </div>
</article>
